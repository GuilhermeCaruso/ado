# Example: single service self-declaration
# This file lives at the root of the catalog-service repository.
# It was generated by running the index-service skill inside that repo.

ado_version: v1
service: catalog-service
domain: ecommerce
generated_at: 2026-04-20

ownership_type: owner
status: active
criticality: high
description: >
    Serves the product catalog: listings, search, and real-time inventory availability.
    Acts as the source of truth for product data across the ecommerce domain.
    Caches frequently accessed products in Redis to handle high read throughput
    from storefronts and other services.

tech_stack:
    language: go
    framework: fiber

url: github.com/example-org/catalog-service
docs:
    readme: github.com/example-org/catalog-service/blob/main/README.md
    ai_context: github.com/example-org/catalog-service/blob/main/docs/AI_CONTEXT.md

routes:
    - id: b2c3d4e5-0001-0000-0000-000000000002
      path: /v1/products/{id}/availability
      method: GET
      description: >
          Returns current stock availability for a product.
          Used by order-service before accepting an order to prevent overselling.
      headers:
        - authorization: string
      params:
        - id: uuid
      stores:
        - store: mongodb_catalog
          collection: inventory
          access: read
        - store: redis_catalog_cache
          access: read

    - id: b2c3d4e5-0002-0000-0000-000000000002
      path: /v1/products
      method: GET
      description: Lists active products with optional category filter, search query, and pagination.
      headers:
        - authorization: string
      params:
        - category: string
        - q: string
        - page: integer
        - limit: integer
      stores:
        - store: mongodb_catalog
          collection: products
          access: read
        - store: redis_catalog_cache
          access: read_write

    - id: b2c3d4e5-0003-0000-0000-000000000002
      path: /v1/products/{id}
      method: GET
      description: Returns full product details including pricing and current stock level.
      headers:
        - authorization: string
      params:
        - id: uuid
      stores:
        - store: mongodb_catalog
          collection: products
          access: read
        - store: redis_catalog_cache
          access: read_write

dependencies:

events:
    published:
    subscribed:
